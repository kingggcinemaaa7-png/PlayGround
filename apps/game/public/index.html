<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920, initial-scale=1">
<title>Kapadokya Beat Vadisi — OBS 1080x1920</title>
<style>
  html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:#060a1a;color:#fff;
    font-family:"Segoe UI",system-ui,"Noto Sans",sans-serif}
  #c{position:absolute;inset:0}
  #hud{position:absolute;inset:0;pointer-events:none}
  #announce{position:absolute;top:120px;left:60px;right:60px;text-align:center;font-size:54px;font-weight:800;
    text-shadow:0 4px 24px #000,0 0 40px #f90;opacity:0;transition:opacity .3s}
  #moon{position:absolute;top:60px;left:60px;font-size:40px;background:rgba(0,0,0,.55);border:2px solid #ffd97a;
    border-radius:16px;padding:10px 22px}
  #hypeWrap{position:absolute;top:170px;left:60px;right:60px;height:26px;background:rgba(255,255,255,.15);border-radius:13px}
  #hype{height:100%;width:0%;border-radius:13px;background:linear-gradient(90deg,#f90,#0cf,#c0f)}
  #top7{position:absolute;top:220px;right:40px;font-size:30px;background:rgba(0,0,0,.45);border-radius:12px;padding:12px 18px}
  #stage{position:absolute;bottom:0;left:0;right:0;height:640px;display:flex;align-items:flex-end;justify-content:center;gap:18px}
  .dancer{background:rgba(0,0,0,.62);border:3px solid #f90;border-radius:18px;padding:14px 18px;text-align:center;
    animation:pop .35s ease-out}
  .dancer.front{transform:scale(1.25);border-color:#0cf;box-shadow:0 0 44px #0cf}
  .dancer .nm{font-size:68px;font-weight:800;line-height:1.05;max-width:280px;white-space:pre-line}
  .dancer .tr{font-size:30px;opacity:.9}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  #drop{position:absolute;inset:0;background:radial-gradient(circle,#fff8,#f604);opacity:0;transition:opacity .4s}
  #status{position:absolute;bottom:8px;left:16px;font-size:24px;opacity:.7}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="hud">
  <div id="moon">🌙 Ay: —</div>
  <div id="hypeWrap"><div id="hype"></div></div>
  <div id="top7">⭐ Büyükayı<br>—</div>
  <div id="announce"></div>
  <div id="stage"></div>
  <div id="status">bağlanıyor…</div>
</div>
<div id="drop"></div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
