<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bulunamadı — Çay Ocağı Kaosu</title>
  <style>
    html, body { margin: 0; height: 100%; background: #07050b; color: #f8ecd4; font-family: "Segoe UI", system-ui, sans-serif; }
    body { display: grid; place-items: center; text-align: center; padding: 24px; }
    .cup { font-size: 64px; filter: drop-shadow(0 12px 26px rgba(0,0,0,.6)); }
    h1 { font-family: Georgia, serif; font-size: clamp(26px, 5vw, 40px); margin: 14px 0 8px; }
    p { color: #a7979f; margin: 0 0 22px; font-size: 14px; }
    a { display: inline-block; padding: 11px 18px; border-radius: 10px; background: linear-gradient(180deg, #ffcf92, #e7903c); color: #24160a; text-decoration: none; font-weight: 650; font-size: 13px; }
  </style>
</head>
<body>
  <div>
    <div class="cup" aria-hidden="true">🫖</div>
    <h1>Bu sokakta böyle bir sayfa yok</h1>
    <p>Çay ocağına geri dön, ocak hâlâ sıcak.</p>
    <a href="/">Meydana dön</a>
  </div>
</body>
</html>
