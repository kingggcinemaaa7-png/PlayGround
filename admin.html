<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fetih Korteji · Yönetim Merkezi</title><style>:root{--bg:#090d14;--panel:#111827;--line:#263248;--gold:#dcb96a;--red:#b53a32;--text:#edf2f7;--muted:#91a0b5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,sans-serif}.shell{max-width:1500px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.top h1{margin:0;font-size:20px}.status{color:#73d7a1}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}.connection{grid-column:span 4}.stats{grid-column:span 8;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:12px;border:1px solid var(--line);border-radius:8px}.stat b{display:block;color:var(--gold);font-size:24px}.mapping{grid-column:span 8}.actions{grid-column:span 4}.wide{grid-column:span 12}.row{display:flex;gap:8px;align-items:center}.field{flex:1;padding:10px;border:1px solid var(--line);border-radius:7px;background:#0b1019;color:white}button{border:1px solid #3a4961;background:#1a2535;color:white;border-radius:7px;padding:9px 11px;cursor:pointer}button.primary{background:#7d251f;border-color:#c05045}button.active{outline:2px solid var(--gold)}button.danger{background:#45191a}.giftList{height:330px;overflow:auto;border:1px solid var(--line);border-radius:8px}.gift{display:flex;align-items:center;gap:9px;padding:8px;border-bottom:1px solid #202b3b;cursor:pointer}.gift img{width:38px;height:38px;object-fit:contain}.gift.selected{background:#242e40}.actionsGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.action{text-align:left;font-size:12px}.search{width:100%;margin-bottom:8px}.switch{display:inline-flex;align-items:center;gap:8px}.range{accent-color:var(--gold);width:180px}.leader{max-height:260px;overflow:auto}.player{display:flex;justify-content:space-between;border-bottom:1px solid #202b3b;padding:7px}.test{display:flex;flex-wrap:wrap;gap:7px}.tag{color:var(--muted);font-size:12px}@media(max-width:900px){.connection,.mapping,.actions{grid-column:span 12}.stats{grid-column:span 12}}
</style></head><body><div class="shell"><div class="top"><h1>🏛️ Fetih Korteji · Yönetim Merkezi</h1><span id="status" class="status">● Beklemede</span></div><div class="grid"><section class="card connection"><h3>Bağlantı & Yayın</h3><div class="row"><input id="username" class="field" placeholder="@kullaniciadi"><button id="connect" class="primary">Bağlan</button><button id="disconnect">Kes</button></div></section><section class="card stats"><div class="stat">Canlı İzleyici<b id="viewers">0</b></div><div class="stat">Toplam Beğeni<b id="likes">0</b></div><div class="stat">Toplanan Jeton<b id="coins">0</b></div></section><section class="card mapping"><h3>2026 Hediye -> Aksiyon Eşleştirme</h3><input id="search" class="field search" placeholder="Hediye ara..."><div id="gifts" class="giftList"></div></section><section class="card actions"><h3>Oyun Aksiyonları</h3><div id="actions" class="actionsGrid"></div><p class="tag">Seçili hediyeyi eşlemek için bir aksiyon seçin.</p><button id="saveMap" class="primary">Eşlemeyi Kaydet</button></section><section class="card"><h3>Oran & Yayın</h3><div class="row"><button data-mode="portrait" class="mode">9:16 Dikey</button><button data-mode="landscape" class="mode active">16:9 Yatay</button></div><label class="switch" style="margin-top:12px"><input id="safe" type="checkbox"> Safe-Zone kılavuzu</label></section><section class="card"><h3>Ses Kontrolü</h3><label>Master Volume <input id="volume" class="range" type="range" min="0" max="100" value="70"></label><br><br><label class="switch"><input id="mute" type="checkbox"> Sesi kapat</label></section><section class="card"><h3>Canlı Simülasyon</h3><div class="test"><button data-test="JOIN_MARCH">Profil Giriş</button><button data-test="EVENT_MEHTER">Mehter</button><button data-test="EVENT_CATAPULT">Mancınık</button><button data-test="EVENT_SEAL">Sadrazam Mührü</button><button data-test="RANK_CAVALRY">Atlı Akıncı</button><button data-test="RANK_VIZIER">Vezir / Ferman</button></div></section><section class="card wide"><h3>Liderlik & Tur</h3><div class="row" style="justify-content:flex-end"><button id="reset" class="danger">Yeni Tur / Sıfırla</button></div><div id="leader" class="leader"></div></section></div></div><script src="/socket.io/socket.io.js"></script><script src="/js/admin.js"></script></body></html>
