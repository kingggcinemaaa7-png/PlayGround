<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Fetih Live — Yönetim Merkezi</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101419;color:#dce4e8;font:14px Inter,system-ui}header{height:64px;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid #26313a;background:#171d23}h1{font-size:18px;margin:0;color:#eacb91}.dot{width:9px;height:9px;border-radius:50%;background:#b7a876;display:inline-block;margin-right:8px}.grid{display:grid;grid-template-columns:320px 1fr 300px;gap:12px;padding:12px}.card{background:#171d23;border:1px solid #26313a;border-radius:10px;padding:14px;margin-bottom:12px}.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#aab5bb;margin:0 0 12px}label{display:block;color:#98a3a8;margin:8px 0 5px}.row{display:flex;gap:8px}input,select,button{border:1px solid #34414a;background:#0d1216;color:#edf3f5;border-radius:7px;padding:9px}input,select{width:100%}button{cursor:pointer}button.primary{background:#9b6d29;border-color:#c99a50;color:#fff}button.danger{background:#61241e;border-color:#96392f}.status{padding:8px;border-radius:6px;background:#0d1216}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:#0d1216;border-radius:8px;padding:10px}.metric b{display:block;font-size:20px;color:#eacb91}.matrix{display:grid;grid-template-columns:1fr 220px}.gift-list{max-height:430px;overflow:auto}.gift{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:8px;padding:7px;border-bottom:1px solid #26313a}.gift img{width:38px;height:38px;object-fit:contain}.actions button{display:block;width:100%;margin:5px 0;text-align:left}.leader{display:flex;align-items:center;gap:8px;padding:7px;border-bottom:1px solid #26313a}.leader img{width:30px;height:30px;border-radius:50%}.rank{margin-left:auto;color:#eacb91}.toggles{display:flex;gap:6px}small{color:#8b979d}.sim{display:grid;grid-template-columns:1fr 1fr;gap:6px}.sim button{font-size:12px}@media(max-width:1100px){.grid{grid-template-columns:260px 1fr}.grid>aside:last-child{display:none}}@media(max-width:760px){.grid{grid-template-columns:1fr}.matrix{grid-template-columns:1fr}}</style></head><body><header><h1>FETİH LIVE</h1><div style="margin-left:auto"><span class="dot" id="dot"></span><span id="status">Bağlantı bekleniyor</span></div></header><main class="grid"><aside><section class="card"><h2>Bağlantı & Yayın</h2><label>TikTok kullanıcı adı</label><div class="row"><input id="username" placeholder="@kullanici"><button class="primary" id="connect">Bağlan</button></div><div class="row" style="margin-top:8px"><button class="danger" id="disconnect">Kes</button></div><div class="metrics" style="margin-top:12px"><div class="metric"><small>İzleyici</small><b id="viewers">0</b></div><div class="metric"><small>Beğeni</small><b id="likes">0</b></div><div class="metric"><small>Jeton</small><b id="gifts">0</b></div></div></section><section class="card"><h2>Liderlik & Tur</h2><div id="leaders"></div><button class="danger" id="reset" style="width:100%;margin-top:8px">Yeni Tur / Sıfırla</button></section></aside><section><section class="card"><h2>Hediye → Aksiyon eşleştirme</h2><div class="row"><input id="search" placeholder="Hediye ara"><select id="filter"><option value="0">Tüm jetonlar</option><option value="10">10+ jeton</option><option value="100">100+ jeton</option><option value="500">500+ jeton</option></select></div><div class="matrix" style="margin-top:10px"><div class="gift-list" id="giftsList"></div><div class="actions" id="actions"></div></div></section><section class="card"><h2>Canlı Simülasyon Test Masası</h2><div class="sim"><button data-action="JOIN_MARCH">Profil resimli giriş</button><button data-action="EVENT_MEHTER">Mehter Coşkusu</button><button data-action="EVENT_CATAPULT">Mancınık</button><button data-action="EVENT_SEAL">Sadrazam Mührü</button><button data-action="RANK_CAVALRY">Atlı Akıncı</button><button data-action="RANK_VIZIER">Vezir / Taht</button></div></section></section><aside><section class="card"><h2>Ekran Oranı</h2><div class="toggles"><button id="vertical">9:16 Dikey</button><button id="horizontal">16:9 Yatay</button></div><label><input type="checkbox" id="safe" style="width:auto"> Safe-Zone kılavuzu</label></section><section class="card"><h2>Ses Kontrolü</h2><label>Master Volume: <span id="volv">70%</span></label><input id="volume" type="range" min="0" max="100" value="70"><label><input type="checkbox" id="mute" style="width:auto"> Sesi kapat</label><button id="drum" style="width:100%;margin-top:8px">Kös / Zil testi</button></section><section class="card"><h2>Bağlantı Durumu</h2><div class="status" id="detail">Sunucu hazır</div></section></aside></main><script src="/socket.io/socket.io.js"></script><script src="/js/admin.js"></script></body></html>
